<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Паспорта объектов</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Паспорта">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: showroom catalog — hero + stats, icon filter bar, grid of rounded cover cards; object page with hero, stats, completeness, detail panels */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --soft:#efebe6; --line:#e5e0d9;
  --ink:#1c1a17; --muted:#8a847b; --inv:#ffffff; --wood1:#8a7360; --wood2:#3b3029;
  --ok:#2f7a4f; --no:#b4233c;
  --g-orange:linear-gradient(135deg,#f4bd6c,#e8907a); --g-blue:linear-gradient(135deg,#7189f7,#4f63dd);
  --g-teal:linear-gradient(135deg,#6fcbdd,#4aa5c1); --g-green:linear-gradient(135deg,#7edcaf,#5bbf8e);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-lg:28px; --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg{display:block}
.shell{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.topin{display:flex;align-items:center;gap:20px;padding-block:16px}
.logo{font:500 16px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.navl{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.navl button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.navl button[aria-pressed="true"]{color:var(--ink)}
.grow{flex:1}

.pill{display:inline-flex;align-items:center;gap:14px;border:0;border-radius:999px;cursor:pointer;text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap;background:var(--ink);color:var(--inv);padding:6px 6px 6px 22px;min-height:46px}
.pill .ar{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--inv) 16%,transparent);display:grid;place-items:center}
.pill.sm{min-height:38px;font-size:13px;padding:4px 4px 4px 16px;gap:10px}
.pill.sm .ar{width:30px;height:30px}
.pill.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pill.light .ar{background:var(--soft)}
.link{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none}
.circ{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover,.circ:hover{border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}

.eyebrow{font:500 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tagpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:500 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
h1,h2{font-family:var(--f-display);font-weight:500;letter-spacing:-.03em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.4vw,50px);line-height:1.08}
h1 .lt{font-weight:300}
h2{font-size:clamp(21px,2.6vw,28px);line-height:1.2}
.lead{color:var(--muted);max-width:46ch;margin:18px 0 0;font-size:15px}
.secthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.secthead .eyebrow{display:block;margin-bottom:12px}
section.sec{margin-top:64px}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:stretch;padding-block:28px 8px}
.hero .txt{padding:28px 0;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero .txt h1{margin-top:22px}
.search{display:flex;align-items:center;gap:10px;margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;max-width:520px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14.5px;padding:8px 0}
.statcard{border-radius:var(--r-lg);background:linear-gradient(150deg,var(--wood1),var(--wood2));color:#f6efe7;padding:34px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:360px;position:relative;overflow:hidden}
.statcard::after{content:"";position:absolute;inset:auto -10% -40% 30%;height:80%;background:radial-gradient(closest-side,rgba(255,236,210,.22),transparent);pointer-events:none}
.statcard .big{font-family:var(--f-display);font-weight:300;font-size:clamp(64px,9vw,104px);line-height:.9;letter-spacing:-.04em}
.statcard .cap{color:rgba(246,239,231,.72);font-size:14px;max-width:30ch}
.statcard .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid rgba(246,239,231,.2);padding-top:22px;position:relative;z-index:1}
.statcard .row b{display:block;font-weight:400;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statcard .row span{font-size:12px;color:rgba(246,239,231,.7)}

/* filter bar */
.fbar{background:var(--surface);border-radius:var(--r-lg);padding:26px 28px;display:grid;gap:22px;margin-bottom:22px}
.fgroup{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.fgroup>.eyebrow{padding-top:14px}
.ftiles{display:flex;flex-wrap:wrap;gap:10px}
.rt{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:88px;padding:14px 12px 12px;border:1px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink)}
.rt svg{color:var(--muted)}
.rt .n{font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.rt[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.rt[aria-pressed="true"] svg,.rt[aria-pressed="true"] .n{color:color-mix(in srgb,var(--inv) 70%,transparent)}
.at{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:500}
.at .ic{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.at .st{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.at[data-state="yes"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.at[data-state="yes"] .st{color:var(--ok)}
.at[data-state="no"]{border-color:var(--no);background:color-mix(in srgb,var(--no) 8%,var(--surface))}
.at[data-state="no"] .st{color:var(--no)}
.fhint{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(40,28,18,.35)}
.cover{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:linear-gradient(155deg,var(--wood1),var(--wood2))}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:18px 22px;color:rgba(246,239,231,.9);font-weight:300;font-size:64px;letter-spacing:-.04em;line-height:1}
.cover .tint{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55}
.cover .tags{position:absolute;left:14px;top:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.ctag{background:rgba(255,255,255,.88);color:#1c1a17;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#bbb}
.card .body{display:flex;gap:12px;align-items:flex-end;padding:18px 18px 18px 22px}
.card .body .t{flex:1;min-width:0}
.card .nm{font-size:17px;font-weight:500;letter-spacing:-.01em;display:block}
.card .ad{font-size:12.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.meter{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--soft);max-width:120px;position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0 auto 0 0;border-radius:2px}
.empty{grid-column:1/-1;background:var(--surface);border-radius:var(--r-lg);padding:48px 28px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:8px}

.ohero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.38fr);gap:24px;padding-block:22px 0;align-items:stretch}
.ohero .txt{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-block:12px}
.ohero h1{margin-top:22px;font-size:clamp(30px,4.2vw,48px)}
.addr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;background:var(--surface)}
.acts{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:30px}
.bigcover{position:relative;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 64px;overflow:hidden;min-height:400px;background:linear-gradient(155deg,var(--wood1),var(--wood2))}
.bigcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigcover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:30px 34px;color:rgba(246,239,231,.9);font-weight:300;font-size:clamp(90px,14vw,170px);line-height:.85;letter-spacing:-.05em}
.bigcover .tint{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.55}
.back{margin-top:22px}

.stats{display:flex;flex-wrap:wrap;row-gap:22px;background:var(--surface);border-radius:var(--r-lg);margin-top:28px;padding:26px 8px}
.stat{flex:1 1 0;min-width:max-content;padding:0 24px;border-left:1px solid var(--line)}
.stat b.word{font-size:clamp(19px,1.9vw,25px);line-height:1.15;padding-top:.35em}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--f-display);font-weight:300;font-size:clamp(26px,2.8vw,38px);white-space:nowrap;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat b small{font-size:.45em;letter-spacing:0;margin-left:4px}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:8px}

.fillcard{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:26px 30px;margin-top:18px}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fillcard h3{margin:0 0 6px;font-weight:500;font-size:16px}
.fillcard p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.miss{display:flex;flex-wrap:wrap;gap:6px}
.miss span{border:1px dashed var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel{background:var(--surface);border-radius:var(--r);padding:24px 26px;min-width:0}
.panel h3{font-size:16px;font-weight:500;margin:0 0 10px;display:flex;align-items:center;gap:12px}
.panel h3 .ic{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.panel p{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.mono{font-family:var(--f-mono);font-size:13px}
.kv{display:grid;grid-template-columns:minmax(130px,220px) 1fr}
.kv>div{padding:12px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--muted);font-size:13.5px;padding-right:12px;display:flex;align-items:center;gap:6px}
.kv .nil{color:var(--muted);font-style:italic}
.locked{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--r);padding:20px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.tile .ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tile b{font-weight:500;font-size:14.5px}
.tile.no{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.tile.no .ic{background:transparent;border:1px solid var(--line)}
.missing{background:var(--surface);border-radius:var(--r);padding:22px 26px;color:var(--muted)}

.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.file{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.file .thumb{aspect-ratio:4/3;max-width:100%;background:var(--soft);display:grid;place-items:center;border:0;padding:0;cursor:zoom-in;color:var(--muted);font:500 14px var(--f-mono);text-decoration:none}
.file .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .cap{padding:12px 12px 12px 16px;display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:500}
.file .cap span{flex:1;min-width:0;overflow-wrap:anywhere}
.file .cap .circ{width:32px;height:32px}

.howto{background:var(--ink);color:var(--inv);border-radius:var(--r-lg);padding:28px 30px;display:grid;gap:10px}
.howto .eyebrow{color:color-mix(in srgb,var(--inv) 60%,transparent)}
.howto p{margin:0;font-size:15px;max-width:70ch}
.howto code{font-family:var(--f-mono);font-size:13px;background:color-mix(in srgb,var(--inv) 12%,transparent);padding:2px 7px;border-radius:6px}

.modal{position:fixed;inset:0;background:rgba(14,12,10,.55);z-index:40;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal form{background:var(--surface);border-radius:var(--r-lg);padding:30px;width:min(420px,100%);display:grid;gap:14px}
.modal h2{font-size:22px}
.modal p{margin:0;color:var(--muted);font-size:14px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.err{color:var(--no);font-size:13.5px;min-height:1.2em}
.lb{position:fixed;inset:0;background:rgba(14,12,10,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:80vh;border-radius:18px}
.lb .bar{display:flex;gap:10px;align-items:center;color:#fff;flex-wrap:wrap;justify-content:center}
.lb .btn{background:#ffffff;color:#1c1a17;border-color:#ffffff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--inv);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60}
footer{margin-top:80px;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}

/* editing */
.form{display:grid;gap:18px;margin-top:28px}
.fs{background:var(--surface);border:0;border-radius:var(--r);padding:24px 26px;margin:0;min-width:0}
.fs legend{float:left;width:100%;font:500 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:18px}
.grid{clear:both;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px}
.grid .wide{grid-column:1/-1}
label.f{display:grid;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
label.f .sec{display:inline-flex;align-items:center;gap:4px}
textarea.field{resize:vertical;min-height:84px;font:inherit;font-size:15px}
.field:disabled{opacity:.55}
.amedit{clear:both;display:flex;flex-wrap:wrap;gap:8px}
.am3{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-size:13.5px;background:var(--bg)}
.am3 .ic{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.am3 .st{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.am3[data-v="yes"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.am3[data-v="yes"] .st{color:var(--ok)}
.am3[data-v="no"]{border-color:var(--no);background:color-mix(in srgb,var(--no) 8%,var(--surface))}
.am3[data-v="no"] .st{color:var(--no)}
.crow{clear:both;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto auto;gap:10px;margin-bottom:10px;align-items:center}
.lockt{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.lockt[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.lockt:disabled{opacity:.4;cursor:not-allowed}
.savebar{position:sticky;bottom:0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.banner{background:var(--soft);border-radius:var(--r);padding:16px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.btn.danger{color:var(--no)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);font-size:14px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:12px}

const unb64=s=>Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0));

async function deriveKey(pass){

  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:unb64(cfg.salt),iterations:cfg.iterations},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);

async function gh(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`,{...opts,cache:"no-store",headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});
  if(r.status===401){logout(true);throw{code:"auth",message:"Ключ доступа больше не действует. Войдите заново."}}
  return r;
}
async function getFile(path){
  const r=await gh(`contents/${path}?ref=${GH.branch}`);
  if(r.status===404)return null;
  if(!r.ok)throw{code:"http",status:r.status,message:"GitHub ответил ошибкой "+r.status};
  return r.json();
}
async function putFile(path,b64content,message,sha){
  const r=await gh(`contents/${path}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,content:b64content,branch:GH.branch,...(sha?{sha}:{})})});
  if(r.status===409||r.status===422)throw{code:"conflict"};
  if(r.status===403||r.status===404)throw{code:"perm",message:"У ключа нет права записи в репозиторий."};
  if(!r.ok)throw{code:"http",message:"Не удалось сохранить в GitHub ("+r.status+")"};
  return r.json();
}
async function deleteFile(path,message){
  const f=await getFile(path);if(!f)return;
  const r=await gh(`contents/${path}`,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,sha:f.sha,branch:GH.branch})});
  if(!r.ok&&r.status!==404)throw{code:"http",message:"Не удалось удалить файл ("+r.status+")"};
}
async function commitJSON(path,mutate,message,indent){
  for(let attempt=0;attempt<3;attempt++){
    const f=await getFile(path);
    const cur=f?JSON.parse(b64utf8(f.content)):null;
    const next=await mutate(cur);
    try{await putFile(path,utf8b64(JSON.stringify(next,null,indent)),message,f&&f.sha);return next}
    catch(e){if(e.code!=="conflict"||attempt===2)throw e}
  }
}

/* ---------- seal ---------- */
function plainOf(o){
  const s=secrets[o.id]||{};const p=JSON.parse(JSON.stringify(o));
  for(const f of SECRET)p[f]=aes?(s[f]||""):"";
  p.custom=(p.custom||[]).map(r=>r.secret?{label:r.label,secret:true,value:aes?((s.custom||{})[r.label]||""):"",filled:r.filled}:r);
  delete p.enc;delete p.secretFilled;return p;
}
async function seal(plain,old){
  const pub=JSON.parse(JSON.stringify(plain));
  if(!aes){
    for(const f of SECRET)delete pub[f];
    pub.custom=(pub.custom||[]).map(r=>r.secret?{label:r.label,secret:true,filled:!!((old?.custom||[]).find(c=>c.label===r.label)?.filled)}:{label:r.label,value:r.value||""});
    pub.secretFilled=old?.secretFilled||[];pub.enc=old?.enc||"";
    return{pub,payload:secrets[old?.id]};
  }
  const payload={};
  for(const f of SECRET){const v=String(pub[f]||"").trim();delete pub[f];if(v)payload[f]=v}
  const cv={};
  pub.custom=(pub.custom||[]).map(r=>{if(r.secret){const v=String(r.value||"").trim();if(v)cv[r.label]=v;return{label:r.label,secret:true,filled:!!v}}return{label:r.label,value:r.value||""}});
  if(Object.keys(cv).length)payload.custom=cv;
  pub.secretFilled=SECRET.filter(f=>payload[f]);
  const oldP=old?secrets[old.id]:null;
  pub.enc=!Object.keys(payload).length?"":(old?.enc&&oldP&&stable(oldP)===stable(payload)?old.enc:await encrypt(payload));
  return{pub,payload};
}

function collect(){

  p.sleep={};f.querySelectorAll("[data-sleep]").forEach(el=>{const n=+el.dataset.n||0;if(n>0)p.sleep[el.dataset.sleep]=n});
  p.amenities={};f.querySelectorAll("[data-am3]").forEach(el=>{const v=el.dataset.v;if(v==="yes")p.amenities[el.dataset.am3]=true;if(v==="no")p.amenities[el.dataset.am3]=false});
  const oldCustom=base.custom||[];

async function save(){
  const plain=collect();
  if(!plain.name){toast("Укажите название");return}
  const old=objs.find(o=>o.id===plain.id);
  const known=new Set((old?.custom||[]).map(r=>r.label.toLowerCase()));
  const newRows=plain.custom.filter(r=>!known.has(r.label.toLowerCase())).map(r=>({label:r.label,secret:!!r.secret}));
  let toAll=false;
  if(newRows.length&&objs.length>(old?1:0)){toAll=await askAll(newRows);if(toAll===null)return}
  busy(true,"Сохраняю в GitHub…");
  try{
    const {pub}=await seal(plain,old);
    await commitObjects(arr=>{
      const i=arr.findIndex(o=>o.id===pub.id);if(i>=0)arr[i]=pub;else arr.push(pub);
      if(toAll)for(const o of arr){if(o.id===pub.id)continue;o.custom=o.custom||[];
        for(const r of newRows)if(!o.custom.some(c=>c.label.toLowerCase()===r.label.toLowerCase()))o.custom.push(r.secret?{label:r.label,secret:true,filled:false}:{label:r.label,value:""})}
    },`${pub.name}: правка паспорта${toAll?" (+ строки ко всем объектам)":""}`);
    if(toAll)await commitJSON("data/fields.json",cur=>{cur=cur||{rows:[]};cur.rows=cur.rows||[];for(const r of newRows)if(!cur.rows.some(x=>x.label.toLowerCase()===r.label.toLowerCase()))cur.rows.push(r);fieldsCfg=cur;return cur},"Строки для всех объектов: "+newRows.map(r=>r.label).join(", "),2);
    editing=false;draft=null;confirmDel=false;
    if(location.hash.slice(1)!==pub.id){selId=pub.id;history.replaceState(null,"","#"+pub.id)}
    renderNav();render();scrollTo(0,0);
    toast(toAll?"Сохранено, строки добавлены ко всем":"Сохранено");
  }catch(e){if(e.code==="perm")permHelp();else toast(e.message||"Не удалось сохранить. Попробуйте ещё раз.")}
  finally{busy(false)}
}

  if(objs.some(o=>o.id===id))id="o-"+Date.now().toString(36);
  draft={id,num:String(next).padStart(2,"0"),name:"",city:"Санкт-Петербург",order:next,amenities:{},photos:[],
    custom:(fieldsCfg.rows||[]).map(r=>({label:r.label,value:"",secret:!!r.secret}))};
  for(const f of SECRET)draft[f]="";
  if(!selId)homeScroll=scrollY;
  selId=id;editing=true;confirmDel=false;render();scrollTo(0,0);
}

/* ---------- files ---------- */
function slug(name){const base=name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");return base.slice(0,40)||"file"}
async function prepImage(file){
  try{
    const bmp=await createImageBitmap(file);const max=2000;const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  }catch(e){return null}
}
async function blobB64(blob){return b64(new Uint8Array(await blob.arrayBuffer()))}
async function uploadFiles(files){
  const o=objs.find(x=>x.id===selId);if(!o||!token)return;
  const st=()=>$("#upStatus");const added=[],errs=[];
  busy(true,"Загружаю файлы…");
  try{
    let room=MAX_IMG-imgCount(o),skipped=0;
    if(room<=0&&[...files].every(f=>!(f.type==="application/pdf"||/\.pdf$/i.test(f.name)))){errs.push(`Уже ${MAX_IMG} фото — это максимум. Удалите лишнее в «Файлах объекта», чтобы добавить новое.`)}
    for(const [i,file] of [...files].entries()){
      const isPdfF=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
      if(!isPdfF){if(room<=0){skipped++;continue}room--}
      if(st()){st().className="status";st().textContent=`Загружаю ${i+1} из ${files.length}: ${file.name}`}
      let blob,type,ext;
      if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){if(file.size>20*1024*1024){errs.push(file.name+": больше 20 МБ");continue}blob=file;type="application/pdf";ext="pdf"}
      else{blob=await prepImage(file);if(!blob){errs.push(file.name+": не удалось открыть изображение (нужны JPG, PNG, WEBP, HEIC на iPhone)");continue}type="image/jpeg";ext="jpg"}
      const path=`files/${o.id}/${Date.now()}-${slug(file.name)}.${ext}`;
      try{await putFile(path,await blobB64(blob),`${o.name}: файл ${file.name}`);previews[path]=URL.createObjectURL(blob);added.push({path,caption:file.name.replace(/\.[^.]+$/,""),type})}
      catch(e){if(e.code==="perm"){permHelp();break}errs.push(file.name+": "+(e.message||"ошибка загрузки"))}
    }
    if(skipped&&room<=0&&!errs.some(x=>x.startsWith("Уже ")))errs.push(`Не загружено фото: ${skipped} — на объект можно не больше ${MAX_IMG}.`);
    if(added.length){await commitObjects(arr=>{const x=arr.find(a=>a.id===o.id);if(x)x.photos=[...(x.photos||[]),...added]},`${o.name}: добавлены файлы (${added.length})`);render(true);toast(added.length===1?"Файл добавлен":`Добавлено файлов: ${added.length}`)}
  }catch(e){errs.push(e.message||"Не удалось обновить паспорт")}
  finally{busy(false)}
  if(st()&&errs.length){st().className="status err";st().textContent=errs.join("; ")}
  if(errs.length)toast(errs[0]);
}
function bindDrop(){
  const d=$("#drop");if(!d)return;
  d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("over")});
  d.addEventListener("dragleave",()=>d.classList.remove("over"));
  d.addEventListener("drop",e=>{e.preventDefault();d.classList.remove("over");if(e.dataTransfer.files.length)uploadFiles(e.dataTransfer.files)});
}
async function photosCommit(o,fn,msg){busy(true);try{await commitObjects(arr=>{const x=arr.find(a=>a.id===o.id);if(x)x.photos=fn([...(x.photos||[])])},msg);render(true)}catch(e){if(e.code==="perm")permHelp();else toast(e.message||"Не удалось сохранить")}finally{busy(false)}}

/* ---------- routing ---------- */
function render(keepScroll){
  const y=scrollY;
  const o=draft&&draft.id===selId?draft:objs.find(x=>x.id===selId);
  if(!o){selId=null;editing=false;renderHome()}
  else{$("#view").innerHTML=editing?renderEdit(editing&&!draft?plainOf(o):o):renderObject(o);if(!editing){bindDrop();bindGal(o)}}
  if(keepScroll)scrollTo(0,y);
}
function route(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const id=objs.some(o=>o.id===h)?h:null;
  if(id===selId&&!draft)return;
  if(id&&!selId)homeScroll=scrollY;
  const wasObj=!!selId;selId=id;editing=false;draft=null;confirmDel=false;pendingDel=null;render();
  scrollTo(0,id?0:(wasObj?homeScroll:0));
}
function lightbox(o,i){
  const imgs=(o.photos||[]).map((p,idx)=>({...p,idx})).filter(p=>p.type!=="application/pdf");
  let k=imgs.findIndex(p=>p.idx===i);if(k<0)return;
  const el=document.createElement("div");el.className="lb";
  const draw=()=>{const p=imgs[k];el.innerHTML=`<img src="${filePath(p.path)}" alt="${esc(p.caption)}"><div class="bar">${imgs.length>1?'<button class="btn" data-lb="prev">←</button>':""}<span>${esc(p.caption)} · ${k+1}/${imgs.length}</span>${imgs.length>1?'<button class="btn" data-lb="next">→</button>':""}<button class="btn" data-lb="close">Закрыть</button></div>`};
  draw();document.body.appendChild(el);
  const step=d=>{k=(k+d+imgs.length)%imgs.length;draw()};
  const key=e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)};
  const close=()=>{el.remove();document.removeEventListener("keydown",key)};
  el.addEventListener("click",e=>{const a=e.target.closest("[data-lb]")?.dataset.lb;if(a==="close"||e.target===el)close();if(a==="next")step(1);if(a==="prev")step(-1)});
  document.addEventListener("keydown",key);
}

document.addEventListener("click",async e=>{
  if(e.target.closest(".modal"))return;
  const cb=e.target.closest("[data-city]");if(cb){fCity=cb.dataset.city;renderNav();if(selId)location.hash="";else{renderFilters();renderCards()}return}
  const rt=e.target.closest("[data-rooms]");if(rt){fRooms=rt.dataset.rooms;renderFilters();renderCards();return}
  const at=e.target.closest("[data-am]");if(at){const k=at.dataset.am;const s=fAm[k]||"";const n=s===""?"yes":s==="yes"?"no":"";if(n)fAm[k]=n;else delete fAm[k];renderFilters();renderCards();return}
  const a3=e.target.closest("[data-am3]");if(a3){const n={"":"yes","yes":"no","no":""}[a3.dataset.v||""];a3.dataset.v=n;a3.querySelector(".st").textContent={"":"не указано","yes":"есть","no":"нет"}[n];return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,o=objs.find(x=>x.id===selId);
  if(a==="home"){if(selId)location.hash="";else scrollTo(0,0)}
  else if(a==="gprev")stepGal(-1);
  else if(a==="gnext")stepGal(1);
  else if(a==="gexp"){const c=document.querySelector("#gal .gcard[aria-current=true]");if(c)lightbox(o,+c.dataset.pi)}
  else if(a==="tonear"){e.preventDefault();const s=$("#nearby");if(s)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
  else if(a==="reset"){fRooms="";fAm={};renderFilters();renderCards()}
  else if(a==="copy"){try{await navigator.clipboard.writeText(b.dataset.v);toast("Скопировано");if(b.classList.contains("cpy")){b.innerHTML=ICON.check;b.classList.add("done");setTimeout(()=>{b.innerHTML=ICON.copy;b.classList.remove("done")},1600)}}catch(_){toast("Скопируйте вручную: "+b.dataset.v)}}
  else if(a==="unlock"){if(aes&&b.id==="lockBtn"){aes=null;secrets={};try{localStorage.removeItem("passport-pw")}catch(_){}headerState();render(true);toast("Коды скрыты")}else openUnlock()}
  else if(a==="unlock-edit"){const keep=collect();openUnlock(()=>{const base=draft?keep:{...plainOf(objs.find(x=>x.id===selId)),...keep,...Object.fromEntries(SECRET.map(f=>[f,(secrets[selId]||{})[f]||""]))};
      if(!draft)base.custom=keep.custom.map(c=>c.secret?{...c,value:((secrets[selId]||{}).custom||{})[c.label]||c.value}:c);
      $("#view").innerHTML=renderEdit(base);toast("Коды открыты")})}
  else if(a==="login"){if(token&&b.id==="editBtn"){logout()}else openLogin()}
  else if(a==="new")newObject();
  else if(a==="edit"){editing=true;confirmDel=false;render();scrollTo(0,0)}
  else if(a==="cancel"){if(draft){draft=null;editing=false;selId=null;history.replaceState(null,"",location.pathname);render();scrollTo(0,homeScroll)}else{editing=false;render();scrollTo(0,0)}}
  else if(a==="slm"||a==="slp"){const el=b.closest("[data-sleep]");let n=(+el.dataset.n||0)+(a==="slp"?1:-1);n=Math.max(0,Math.min(9,n));el.dataset.n=n;el.querySelector("b").textContent=n;el.classList.toggle("on",n>0);
    const bi=$("#f-beds");if(bi&&!bi.dataset.manual){const sl={};document.querySelectorAll("[data-sleep]").forEach(x=>sl[x.dataset.sleep]=+x.dataset.n||0);const t=sleepTotal(sl);bi.value=t?String(t):""}}
  else if(a==="addam")openAddAmenity();
  else if(a==="addrow"){$("#crows").insertAdjacentHTML("beforeend",crow({}));const r=$("#crows").lastElementChild;r.dataset.manual="";r.querySelector("[data-cl]").focus()}
  else if(a==="delrow")b.closest(".crow").remove();
  else if(a==="sectoggle"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);b.closest(".crow").dataset.manual="1"}
  else if(a==="del"||a==="del-no"){confirmDel=a==="del";const y=scrollY;const keep=collect();$("#view").innerHTML=renderEdit(keep);scrollTo(0,y)}
  else if(a==="del-yes"){busy(true,"Удаляю…");try{await commitObjects(arr=>{const i=arr.findIndex(x=>x.id===selId);if(i>=0)arr.splice(i,1)},`${o.name}: паспорт удалён`);editing=false;selId=null;history.replaceState(null,"",location.pathname);renderNav();render();toast("Паспорт удалён")}catch(err){toast(err.message||"Не удалось удалить")}finally{busy(false)}}
  else if(a==="upload")$("#fileIn").click();
  else if(a==="lb")lightbox(o,+b.dataset.i);
  else if(a==="cover"){const i=+b.dataset.i;await photosCommit(o,ps=>{const [p]=ps.splice(i,1);ps.unshift(p);return ps},`${o.name}: новая обложка`)}
  else if(a==="delfile"){pendingDel=o.photos[+b.dataset.i].path;render(true)}
  else if(a==="delfile-no"){pendingDel=null;render(true)}
  else if(a==="delfile-yes"){const p=o.photos[+b.dataset.i];pendingDel=null;busy(true,"Удаляю файл…");try{await deleteFile(p.path,`${o.name}: удалён файл`)}catch(err){toast(err.message)}finally{busy(false)}await photosCommit(o,ps=>ps.filter(x=>x.path!==p.path),`${o.name}: файл убран из паспорта`)}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="f-beds")t.dataset.manual="1";if(t.matches("[data-cl]")){const r=t.closest(".crow");if(r.dataset.manual)return;const lk=r.querySelector("[data-act=sectoggle]");if(lk.disabled)return;lk.setAttribute("aria-pressed",SECRET_HINT.test(t.value))}});
document.addEventListener("change",async e=>{const t=e.target;if(t.dataset.act==="cap"){const o=objs.find(x=>x.id===selId);const i=+t.dataset.i;const v=t.value.trim();await photosCommit(o,ps=>{if(ps[i])ps[i]={...ps[i],caption:v};return ps},`${o.name}: подпись к файлу`)}});
document.addEventListener("submit",e=>{if(e.target.id==="form"){e.preventDefault();save()}});
$("#fileIn").addEventListener("change",e=>{if(e.target.files.length)uploadFiles(e.target.files);e.target.value=""});
addEventListener("hashchange",route);

async function reload(){
  if(token){
    try{
      const [f,fl]=await Promise.all([getFile("data/objects.json"),getFile("data/fields.json")]);
      if(f){objs=JSON.parse(b64utf8(f.content));if(fl)fieldsCfg=JSON.parse(b64utf8(fl.content));await decryptAll();renderNav();render(true);return}
    }catch(e){}
  }
}
(async function boot(){
  headerState();
  try{
    const [d,c,fl]=await Promise.all([fetch("data/objects.json",{cache:"no-cache"}).then(r=>r.json()),fetch("data/crypto.json",{cache:"no-cache"}).then(r=>r.json()),fetch("data/fields.json",{cache:"no-cache"}).then(r=>r.json()).catch(()=>({rows:[]}))]);
    objs=d;cfg=c;fieldsCfg=fl;
  }catch(e){$("#view").innerHTML='<div class="empty" style="margin-top:40px"><h2>Не удалось загрузить данные</h2>Обновите страницу через минуту.</div>';return}
  renderNav();route();
  let saved=null;try{saved=localStorage.getItem("passport-pw")}catch(_){}
  if(saved&&await unlock(saved)){headerState();render(true)}
  if(token)await reload();
})();
</script>
